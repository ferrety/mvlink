services:
  build:
    build:
      context: .
    container_name: mvlink-build
    volumes:
      - .:/app
    command: /bin/bash -c "qmake6 mvlink.pro && make"

  launch:
    build:
      context: .
    container_name: mvlink-launch
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/app
    network_mode: host
    command: /bin/bash -c "qmake6 mvlink.pro && make &&./mvlink"

  make:
    build:
      context: .
    container_name: mvlink-make
    volumes:
      - .:/app
    command: /bin/bash -c "make ${MAKE_TARGET}"
  test:
    build:
      context: .
    container_name: mvlink-test
    environment:
      - QT_QPA_PLATFORM=offscreen
    volumes:
      - .:/app:ro
    working_dir: /tmp/mvlink-test
    command: /bin/bash -c "qmake6 /app/mvlink-test.pro && make && ./mvlink-test"

  windows:
    image: mvlink-windows-${WINDOWS_LINKAGE:-shared}
    profiles: [windows]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.win
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
        WINDOWS_LINKAGE: ${WINDOWS_LINKAGE:-shared}
    environment:
      BUILD_JOBS: ${BUILD_JOBS:-2}
    volumes:
      - .:/src:ro
      - ./dist/windows/${WINDOWS_LINKAGE:-shared}:/out
